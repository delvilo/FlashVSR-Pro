name: Linux CPU checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install CPU test environment
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-test-torch.txt
      - name: Run CLI, loader, installer and real FFmpeg tests
        run: |
          bash -n scripts/install.sh
          python -m unittest discover -s tests -v
      - name: Build and inspect source distribution and wheel
        run: |
          python -m build --no-isolation
          python scripts/check_packages.py
      - name: Verify installed CLI and packaged model assets outside the checkout
        run: |
          python -m venv /tmp/flashvsr-wheel-test
          /tmp/flashvsr-wheel-test/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/flashvsr-wheel-test/bin/flashvsr --help
          /tmp/flashvsr-wheel-test/bin/flashvsr models list --mode tiny
          /tmp/flashvsr-wheel-test/bin/python -c 'from flashvsr.models import ModelRegistry; import tempfile; r = ModelRegistry(directory=tempfile.mkdtemp()); r.entries = tuple(f for f in r.entries if f.bundled); r.download(); r.check()'
      - name: Install application dependencies and editable package
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
          python infer.py --help
          python -m flashvsr models list --mode all
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: python-distributions
          path: dist/*
