name: Linux CPU checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install CPU test environment
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-test-torch.txt
      - name: Run CLI, loader, installer and real FFmpeg tests
        run: |
          bash -n scripts/install.sh
          python -m unittest discover -s tests -v
      - name: Build and inspect source distribution and wheel
        run: |
          python -m build --no-isolation
          python scripts/check_packages.py
      - name: Install application dependencies and editable package
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
          python infer.py --help
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.11'
        with:
          name: python-distributions
          path: dist/*
