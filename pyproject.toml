[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diffsynth"
version = "1.2.0"
description = "FlashVSR-Pro inference, model management and minimal DiffSynth runtime"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "Block-Sparse-Attention/LICENSE", "Block-Sparse-Attention/csrc/cutlass/LICENSE.txt"]
authors = [{name = "Artiprocher"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dynamic = ["dependencies"]

[project.scripts]
flashvsr = "flashvsr.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["flashvsr*", "diffsynth*", "utils*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
flashvsr = ["assets/*.json", "assets/*.pth"]
